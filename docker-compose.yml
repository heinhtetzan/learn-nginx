services:
  nginx:
    image: nginx:alpine
    container_name: learn-nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: hashicorp/http-echo:latest
    container_name: learn-nginx-backend
    command: ["-text=Hello from behind Nginx reverse proxy!"]
    restart: unless-stopped
