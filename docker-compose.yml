services:
  # 1. Apache HTTP Server Sandbox
  apache:
    image: httpd:alpine
    container_name: sandbox-apache
    ports:
      - "8081:80"
    volumes:
      - ./examples/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./examples/static:/usr/local/apache2/htdocs:ro
    depends_on:
      - backend
    restart: unless-stopped

  # 2. NGINX Sandbox
  nginx:
    image: nginx:alpine
    container_name: sandbox-nginx
    ports:
      - "8082:80"
    volumes:
      - ./examples/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/static:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  # 3. Caddy Sandbox
  caddy:
    image: caddy:alpine
    container_name: sandbox-caddy
    ports:
      - "8083:80"
    volumes:
      - ./examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./examples/static:/usr/share/caddy:ro
    depends_on:
      - backend
    restart: unless-stopped

  # 4. Ferron Sandbox (Rust)
  ferron:
    image: ferronweb/ferron:latest
    container_name: sandbox-ferron
    ports:
      - "8084:80"
    volumes:
      - ./examples/ferron/ferron.kdl:/etc/ferron/ferron.kdl:ro
      - ./examples/static:/usr/share/ferron:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Backend Microservice
  backend:
    image: hashicorp/http-echo:latest
    container_name: sandbox-backend
    command: ["-text=Hello from backend microservice!"]
    restart: unless-stopped
