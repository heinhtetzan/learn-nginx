<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Nginx - Local Sandbox</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        h1 { color: #009639; }
        .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin: 20px 0; background: #f6f8fa; }
        code { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>🚀 Nginx Sandbox Environment</h1>
    <p>This page is being served directly by Nginx inside your local Docker Compose container.</p>
    
    <div class="card">
        <h3>Test Endpoints:</h3>
        <ul>
            <li><code>/</code> - This static homepage</li>
            <li><code>/api/</code> - Reverse proxied to upstream echo API container</li>
            <li><code>/healthz</code> - Direct health check (200 OK)</li>
        </ul>
    </div>
</body>
</html>
